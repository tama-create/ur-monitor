name = "ur-monitor-trigger"
main = "worker.js"
compatibility_date = "2026-08-28"

# JST 08:00〜21:00 の間だけ5分おきに起動する。cron は UTC なので時の指定がずれる。
#   UTC 23,0,1,...,12  →  JST 8,9,10,...,21（日本に夏時間は無いので常に +9）
# 1日168回。24時間叩いて worker.js 側で捨てていた頃は288回で、夜間の120回は
# 何もせず終わるだけだった。動きがあるのは営業時間内だけと分かったので cron で絞る。
#
# 無料プランの cron はアカウントあたり5本まで（有料は250本）。他のワーカーと
# 分け合う枠なので、時を一覧で書いて1本に収めてある。
#
# worker.js 側の時間帯判定は消していない。cron と二重になるが、あちらが
# 最終的な番人で、cron を触ったときに時間外へはみ出すのを止める。
#
# 5分にしているのは、UR が営業時間内に随時ページを更新しているため。
# state.json の履歴で、新着が現れうる時間帯を直前の実行との幅で挟むと、
# 幅が1時間半以内に収まる7事象はすべて 09:26〜19:28 の中にあった
# （夜をまたぐ幅430〜953分の3事象は特定できないので除いた）。
# 定時にまとめて更新されるなら詰めても無駄だが、そうはなっていない。
#
# ここを変えたら config.json の zero_streak_limit も必ず合わせること。
# あれは時間ではなく回数なので、間隔を詰めると我慢できる時間が同じ割合で縮む。
[triggers]
crons = ["*/5 0-12,23 * * *"]

# 空き部屋一覧と state の保管庫。Cloudflare の画面で KV を作り、この名前で結び付ける。
# 一覧を GitHub にコミットしないのは、公開リポジトリに UR のデータを残さないため
# （UR は私的使用と引用を除く転載を認めておらず、ウェブページへの掲載は個人でも
# 私的使用にあたらないと明示している）。閲覧は worker.js の Basic 認証の内側。
#
# ダッシュボードから貼って使う場合、この行は効かない。画面の
# Settings → Bindings で Variable name を STORE にして手で結び付けること。
[[kv_namespaces]]
binding = "STORE"
id = "ここに KV の ID を入れる"

# Secret（wrangler では設定しない。画面の Settings → Variables and Secrets で
# **必ず Secret 種別で**入れる。Text にすると画面を開いた人に中身が見える）
#   GITHUB_TOKEN   … workflow_dispatch を叩くためのトークン
#   API_TOKEN      … 監視ジョブが一覧と state を書き込むときの合言葉
#   VIEW_USER      … 一覧を開くときの ID
#   VIEW_PASSWORD  … 一覧を開くときのパスワード（英数字にすること）
