name = "ur-monitor-trigger"
main = "worker.js"
compatibility_date = "2026-08-28"

# JST 08:00〜21:00 の間だけ5分おきに起動する。cron は UTC なので時の指定がずれる。
#   UTC 23,0,1,...,12  →  JST 8,9,10,...,21（日本に夏時間は無いので常に +9）
# 1日168回。24時間叩いて worker.js 側で捨てていた頃は288回で、夜間の120回は
# 何もせず終わるだけだった。動きがあるのは営業時間内だけと分かったので cron で絞る。
#
# 無料プランは1ワーカーあたり cron 3本まで。時の一覧で1本に収めて余裕を残してある。
#
# worker.js 側の時間帯判定は消していない。cron と二重になるが、あちらが
# 最終的な番人で、cron を触ったときに時間外へはみ出すのを止める。
#
# 5分にしているのは、UR が営業時間内に随時ページを更新しているため。
# state.json の履歴で、新着が現れうる時間帯を直前の実行との幅で挟むと、
# 幅が1時間半以内に収まる7事象はすべて 09:26〜19:28 の中にあった
# （夜をまたぐ幅430〜953分の3事象は特定できないので除いた）。
# 定時にまとめて更新されるなら詰めても無駄だが、そうはなっていない。
#
# ここを変えたら config.json の zero_streak_limit も必ず合わせること。
# あれは時間ではなく回数なので、間隔を詰めると我慢できる時間が同じ割合で縮む。
[triggers]
crons = ["*/5 0-12,23 * * *"]
