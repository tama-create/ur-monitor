name = "ur-monitor-trigger"
main = "worker.js"
compatibility_date = "2026-08-28"

# UTC で5分おきに起動する。稼働時間帯（JST 08:00〜21:00）の判定は worker.js 側。
# 無料プランは1ワーカーあたり cron 3本まで。ここで使い切らないよう1本にしてある。
#
# 5分にしているのは、UR 側が定時ではなく随時更新しているように見えるため。
# 履歴から拾った新着34件の出現時刻は 01:28 / 10:58 / 12:37 / 13:04 / 13:17 /
# 13:31 / 15:07 / 16:52 / 17:35 / 18:43 / 19:28 と一日に散っていて、
# 特定の時刻に固まっていない。詰めた分だけ早く気づける。
#
# ここを変えたら config.json の zero_streak_limit も必ず合わせること。
# あれは時間ではなく回数なので、間隔を詰めると我慢できる時間が同じ割合で縮む。
[triggers]
crons = ["*/5 * * * *"]
