name: UR賃貸監視

on:
  # 15分間隔の起動は Cloudflare Workers から workflow_dispatch で行う（trigger/ を参照）。
  # GitHub の schedule は遅延・欠落するため、間隔を守る用途には使えないと判断した。
  # 30分間隔での実測は46〜64分、15分に詰めたあとも1日2回まで落ちた（2026-08-27〜28）。
  #
  # ここに残した schedule は2つの役目がある。
  #   1. 外部トリガーが死んだときの保険（1日4回は必ず動く）
  #   2. 見張りの心拍 — 実行のたびに前回からの空白を見て、開きすぎていれば Slack に
  #      警告を出す（ur_monitor.php の warn_if_stale）。外部トリガーが止まっても
  #      この回が気づいてくれる
  # 低頻度にしてあるのは、要求を減らしたほうが schedule が実際に発火しやすいため。
  schedule:
    - cron: '0 23 * * *'  # 08:00 JST
    - cron: '0 3 * * *'   # 12:00 JST
    - cron: '0 8 * * *'   # 17:00 JST
    - cron: '0 12 * * *'  # 21:00 JST
  # 手動実行用（動作確認に使う）
  workflow_dispatch: {}

permissions:
  contents: write  # state.json / docs/index.html をコミットし直すため

concurrency:
  group: ur-monitor
  cancel-in-progress: false  # 前回実行が state.json を書き込み中なら待つ

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: PHP をセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Composer 依存関係をインストール
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Chrome の場所を確認
        run: which google-chrome-stable || which google-chrome || which chromium-browser

      - name: 監視スクリプトを実行
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: php ur_monitor.php

      - name: 実行結果をコミット
        # ランナーは毎回まっさらでファイルが残らないため、結果はリポジトリに戻して永続化する。
        # docs/index.html を push すると GitHub Pages が自動で再ビルドし、公開ページが最新になる。
        # [skip ci] は付けない。このワークフローに push トリガーが無いので自己ループは起きず、
        # 逆に付けると Pages のビルドまで止めてしまう恐れがあるため。
        #
        # push が弾かれたら main を取り込んで再試行する。実行中に誰かが main へ push すると
        # （PR のマージなど）その回が丸ごと失敗して結果が捨てられるため。実際に起きた:
        # PR マージの5秒後に始まった回が ! [rejected] main -> main (fetch first) で落ちた。
        #
        # 衝突時は -X theirs でこちらの結果を採る。state.json と docs/index.html は毎回
        # まるごと生成し直すものなので、新しく取得したこちらが常に正しい。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json docs/index.html
          if git diff --cached --quiet; then
            echo "変更なし。コミットしません"
            exit 0
          fi
          git commit -m "chore: 監視結果を更新"

          for attempt in 1 2 3; do
            if git push; then
              echo "push 成功（試行 ${attempt} 回目）"
              exit 0
            fi
            echo "push が弾かれました。main を取り込んで再試行します（試行 ${attempt} 回目）"
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::main の取り込みに失敗しました"
              exit 1
            fi
          done
          echo "::error::3 回試しても push できませんでした"
          exit 1
