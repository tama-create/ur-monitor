name: UR賃貸監視

on:
  # 08:00〜21:00 JST・15分間隔（JST = UTC+9 のため UTC では前日23:00〜当日12:00）
  #
  # ここに書いた間隔は「希望」であって「保証」ではない。GitHub の schedule は
  # 混雑時に遅延・破棄されるため、実際の間隔はこれより広がる。30分間隔で運用していた
  # ときの実測は46〜64分で、想定18回に対して12回しか動かなかった（約3分の1が欠落）。
  # 15分にしているのは、発火の試行を増やして実効間隔を縮めるため。
  # 15分間隔で動くようになるわけではない。
  #
  # 公開リポジトリでは Actions が無制限に無料なので、試行を増やしても費用は増えない。
  # private に戻す場合は、この間隔だと無料枠（月2,000分）を超えるので戻すこと。
  schedule:
    - cron: '0,15,30,45 23 * * *'    # 08:00〜08:45 JST
    - cron: '0,15,30,45 0-11 * * *'  # 09:00〜20:45 JST
    - cron: '0 12 * * *'             # 21:00 JST
  # 手動実行用（動作確認に使う）
  workflow_dispatch: {}

permissions:
  contents: write  # state.json / docs/index.html をコミットし直すため

concurrency:
  group: ur-monitor
  cancel-in-progress: false  # 前回実行が state.json を書き込み中なら待つ

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: PHP をセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Composer 依存関係をインストール
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Chrome の場所を確認
        run: which google-chrome-stable || which google-chrome || which chromium-browser

      - name: 監視スクリプトを実行
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: php ur_monitor.php

      - name: 実行結果をコミット
        # ランナーは毎回まっさらでファイルが残らないため、結果はリポジトリに戻して永続化する。
        # docs/index.html を push すると GitHub Pages が自動で再ビルドし、公開ページが最新になる。
        # [skip ci] は付けない。このワークフローに push トリガーが無いので自己ループは起きず、
        # 逆に付けると Pages のビルドまで止めてしまう恐れがあるため。
        #
        # push が弾かれたら main を取り込んで再試行する。実行中に誰かが main へ push すると
        # （PR のマージなど）その回が丸ごと失敗して結果が捨てられるため。実際に起きた:
        # PR マージの5秒後に始まった回が ! [rejected] main -> main (fetch first) で落ちた。
        #
        # 衝突時は -X theirs でこちらの結果を採る。state.json と docs/index.html は毎回
        # まるごと生成し直すものなので、新しく取得したこちらが常に正しい。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json docs/index.html
          if git diff --cached --quiet; then
            echo "変更なし。コミットしません"
            exit 0
          fi
          git commit -m "chore: 監視結果を更新"

          for attempt in 1 2 3; do
            if git push; then
              echo "push 成功（試行 ${attempt} 回目）"
              exit 0
            fi
            echo "push が弾かれました。main を取り込んで再試行します（試行 ${attempt} 回目）"
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::main の取り込みに失敗しました"
              exit 1
            fi
          done
          echo "::error::3 回試しても push できませんでした"
          exit 1
