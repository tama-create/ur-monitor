name: UR賃貸監視

on:
  # 15分間隔の起動は Cloudflare Workers から workflow_dispatch で行う（trigger/ を参照）。
  # GitHub の schedule は遅延・欠落するため、間隔を守る用途には使えないと判断した。
  # 30分間隔での実測は46〜64分、15分に詰めたあとも1日2回まで落ちた（2026-08-27〜28）。
  #
  # ここに残した schedule は2つの役目がある。
  #   1. 外部トリガーが死んだときの保険（1日4回は必ず動く）
  #   2. 見張りの心拍 — 実行のたびに前回からの空白を見て、開きすぎていれば Slack に
  #      警告を出す（ur_monitor.php の warn_if_stale）。外部トリガーが止まっても
  #      この回が気づいてくれる
  # 低頻度にしてあるのは、要求を減らしたほうが schedule が実際に発火しやすいため。
  schedule:
    - cron: '0 23 * * *'  # 08:00 JST
    - cron: '0 3 * * *'   # 12:00 JST
    - cron: '0 8 * * *'   # 17:00 JST
    - cron: '0 12 * * *'  # 21:00 JST
  # 手動実行用（動作確認に使う）
  workflow_dispatch:
    inputs:
      seed_state:
        description: '保管先へ state.json を移す（保管先を用意した直後に1回だけ）'
        type: boolean
        default: false

# 実行結果はリポジトリに戻さなくなったので書き込み権限は要らない。
# 公開リポジトリに UR のデータを残さないため、state と一覧は Cloudflare の
# 保管先（Worker + KV）へ置き、閲覧は Basic 認証の内側に限っている。
permissions:
  contents: read

concurrency:
  group: ur-monitor
  cancel-in-progress: false  # 前回実行が保管先へ書き込み中なら待つ

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: PHP をセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Composer 依存関係をインストール
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Chrome の場所を確認
        run: which google-chrome-stable || which google-chrome || which chromium-browser

      # 保管先を用意した直後の1回だけ。手動実行で seed_state にチェックを入れると走る。
      # これをやらずに本番を回すと保管先が空のままで、監視スクリプトが
      # 「全部屋が新着になる」のを避けて中止する（誤通知よりは止まるほうがまし）。
      - name: 保管先へ state を移す（初回のみ）
        if: inputs.seed_state
        env:
          STORE_URL: ${{ secrets.STORE_URL }}
          STORE_TOKEN: ${{ secrets.STORE_TOKEN }}
        run: php ur_monitor.php --seed-state

      - name: 監視スクリプトを実行
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 未設定ならローカルのファイルに書く動作に落ちる。本番では必ず入れること
          STORE_URL: ${{ secrets.STORE_URL }}
          STORE_TOKEN: ${{ secrets.STORE_TOKEN }}
        run: php ur_monitor.php
