name: UR賃貸監視

on:
  # 08:00〜21:00 JST・30分間隔（JST = UTC+9 のため UTC では前日23:00〜当日12:00）
  # 間隔を30分にしているのは、プライベートリポジトリの Actions 無料枠（月2,000分）に収めるため。
  schedule:
    - cron: '0,30 23 * * *'    # 08:00・08:30 JST
    - cron: '0,30 0-11 * * *'  # 09:00〜20:30 JST
    - cron: '0 12 * * *'       # 21:00 JST
  # 手動実行用（動作確認に使う）
  workflow_dispatch: {}

permissions:
  contents: write  # state.json / docs/index.html をコミットし直すため

concurrency:
  group: ur-monitor
  cancel-in-progress: false  # 前回実行が state.json を書き込み中なら待つ

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: PHP をセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Composer 依存関係をインストール
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Chrome の場所を確認
        run: which google-chrome-stable || which google-chrome || which chromium-browser

      - name: 監視スクリプトを実行
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: php ur_monitor.php

      - name: 実行結果をコミット
        # ランナーは毎回まっさらでファイルが残らないため、結果はリポジトリに戻して永続化する。
        # docs/index.html を push すると GitHub Pages が自動で再ビルドし、公開ページが最新になる。
        # [skip ci] は付けない。このワークフローに push トリガーが無いので自己ループは起きず、
        # 逆に付けると Pages のビルドまで止めてしまう恐れがあるため。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json docs/index.html
          git diff --cached --quiet || git commit -m "chore: 監視結果を更新"
          git push
